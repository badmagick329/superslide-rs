# Pushing a tag like v0.0.1 builds superslide.exe, tests it, and publishes a GitHub release
# with notes generated from the commits since the previous tag (cliff.toml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Links the C runtime into the exe, so it runs on machines without the VC++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs every commit and tag to find the range since the last release.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --release

      - run: cargo build --release

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Write release notes
        run: git cliff --latest --strip all --output notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/superslide.exe \
            --title "SuperSlide-RS $GITHUB_REF_NAME" --notes-file notes.md
